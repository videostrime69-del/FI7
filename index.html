const $ = (s) => document.querySelector(s);
const longUrlInput = $('#longUrl');
const shortBtn = $('#shortBtn');
const resultDiv = $('#result');
const shortUrlInput = $('#shortUrl');
const jsonEntry = $('#jsonEntry');
const codeBadge = $('#codeBadge');

function genCode(len=5){
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let c=''; for(let i=0;i<len;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function isValidUrl(string){
  try{ new URL(string); return true; }catch(_){ return false; }
}

async function getDB(){
  if(CONFIG.API_KEY.includes('YOUR_')) return {};
  try{
    const res = await fetch(\`https://www.googleapis.com/blogger/v3/blogs/\${CONFIG.BLOG_ID}/posts/\${CONFIG.POST_ID}?key=\${CONFIG.API_KEY}&fetchBodies=true\`);
    const data = await res.json();
    let content = data.content || '';
    let jsonStr = content.replace(/<[^>]*>/g,'').trim();
    const match = jsonStr.match(/\\{.*\\}/s);
    if(match) jsonStr = match[0];
    return JSON.parse(jsonStr || '{}');
  }catch(e){ console.error(e); return {}; }
}

async function handleRedirect(){
  const params = new URLSearchParams(location.search);
  let code = params.get('s') || params.get('code');
  // Also check sessionStorage for SPA hack
  const savedPath = sessionStorage.getItem('gh_pages_path');
  if(savedPath){
    sessionStorage.removeItem('gh_pages_path');
    const maybeCode = savedPath.split('/').filter(Boolean).pop();
    if(maybeCode && maybeCode.length <= 10) code = maybeCode;
  }
  if(!code) return;
  $('#main-ui')?.classList.add('hidden');
  $('#redirect-loader')?.classList.remove('hidden');
  const db = await getDB();
  if(db[code]){
    location.replace(db[code]);
  } else {
    document.body.innerHTML = \`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0f;color:white;font-family:sans-serif;text-align:center;padding:24px"><div><h1 style="font-size:24px;margin-bottom:8px">\${code} malyu nahi</h1><p style="opacity:0.6;margin-bottom:16px">Blogger database ma aa code nathi</p><a href="./" style="color:#8b5cf6">Home jao</a></div></div>\`;
  }
}

  const longUrl = longUrlInput.value.trim();
  if(!isValidUrl(longUrl)){ alert('Valid URL nakho - https:// thi start thavu joiye'); return; }
  shortBtn.textContent = 'Banavu chhe...';
  shortBtn.disabled = true;
  const code = genCode(5);
  const shortUrl = \`\${CONFIG.BASE_URL}/?s=\${code}\`;
  
  shortUrlInput.value = shortUrl;
  codeBadge.textContent = code;
  jsonEntry.textContent = \`"\${code}": "\${longUrl}"\`;
  resultDiv.classList.remove('hidden');
  
  // For demo, copy to clipboard hint
  console.log('Add to Blogger JSON:', { [code]: longUrl });
  
  shortBtn.textContent = 'Short Karo';
  shortBtn.disabled = false;
});

$('#copyBtn')?.addEventListener('click', ()=>{
  navigator.clipboard.writeText(shortUrlInput.value);
  const btn = $('#copyBtn');
  const old = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(()=>btn.textContent=old, 1500);
});
