<body class="min-h-screen">
<header class="p-6 border-b border-white/10"><div class="max-w-5xl mx-auto flex justify-between"><h1 class="font-bold">SHORTENER <span class="text-white/40 font-normal">Admin - FI7</span></h1><span class="mono text-xs text-white/40">videostrime69-del.github.io/FI7/</span></div></header>

<div class="flex flex-col md:flex-row gap-3">

<button onclick="copyJson()" class="mt-2 text-xs bg-white/10 rounded-lg px-4 py-2">Copy JSON for Blogger</button>
</div>
</div>

<script>
const BLOGGER_POST_URL = CONFIG.blogPostUrl; // e.g. https://urlshorterio.blogspot.com/2026/09/blog-post.html

function genCode(len=3){ const c='abcdefghijklmnopqrstuvwxyz0123456789'; let s=''; for(let i=0;i<len;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; }

function generate(){
  const longUrl = document.getElementById('longUrl').value.trim();
  if(!longUrl.startsWith('http')){ alert('Valid https:// URL nakho'); return; }
  const code = genCode(3);
  const base = `https://${CONFIG.username}.github.io/${CONFIG.repo}/`;
  const shortLink = base + code;
  document.getElementById('shortLink').textContent = shortLink;
  document.getElementById('jsonCode').textContent = `"${code}": "${longUrl}"`;
  document.getElementById('result').classList.remove('hidden');
  window.lastCode = code; window.lastLong = longUrl;
}
function copyLink(){ navigator.clipboard.writeText(document.getElementById('shortLink').textContent); alert('Short link copied!'); }
function copyJson(){ navigator.clipboard.writeText(document.getElementById('jsonCode').textContent); alert('Copied! Have Blogger ma jaine { } ni andar paste karo'); }

// ---- REDIRECT LOGIC ----
async function getDatabase(){
  // Try to fetch Blogger post via allorigins to avoid CORS
  try{
    const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(BLOGGER_POST_URL)}`;
    const res = await fetch(proxy);
    const data = await res.json();
    const html = data.contents;
    // Extract JSON from inside post: look for { "code": "url" ... }
    const match = html.match(/\{[^]*?"[^"]+"\s*:\s*"https?:[^}]+?\}/);
    if(match){
      // clean html entities
      let jsonStr = match[0].replace(/&quot;/g,'"').replace(/&amp;/g,'&');
      // Try parse
      const obj = JSON.parse(jsonStr);
      return obj;
    }
  }catch(e){ console.log('fetch fail', e); }
  return null;
}

async function handleRedirect(){
  const codeFrom404 = sessionStorage.getItem('shortcode');
  sessionStorage.removeItem('shortcode');
  if(!codeFrom404) return;
  if(codeFrom404 === 'FI7' || codeFrom404 === 'index.html') return;
  
  const box = document.getElementById('redirectBox');
  box.classList.remove('hidden');
  document.getElementById('redirectTo').textContent = `Searching for code: ${codeFrom404} in Blogger...`;
  
  const db = await getDatabase();
  if(db && db[codeFrom404]){
    document.getElementById('redirectTo').textContent = `Found! Redirecting to ${db[codeFrom404]}`;
    setTimeout(()=>{ window.location.href = db[codeFrom404]; }, 800);
  } else {
    document.getElementById('redirectTo').textContent = `Code ${codeFrom404} not found in Blogger DB. Check if Blogger post is Published and contains {"${codeFrom404}": "url"}`;
    // Show debug
    console.log('DB:', db);
  }
}
handleRedirect();
</script>
