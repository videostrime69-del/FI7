      addLog("Using local backup - " + Object.keys(db).length + " links", "warn");
      return db;
    }
  } catch(e) {}

  // Try 3: Hardcoded fallback (for testing)
  addLog("Using fallback sample DB", "warn");
  return {
    "notes": "https://drive.google.com/",
    "portfolio": "https://chintan-portfolio.blogspot.com/",
    "yt": "https://youtube.com/",
    "test": "https://example.com"

}

// --- Main Flow ---
let countdown = 5;
let countdownInterval;
let destinationUrl = null;

async function init() {
  const slug = getSlug();
  document.getElementById('infoSlug').textContent = slug || "(none)";
  document.getElementById('errorSlug').textContent = slug || "(empty)";
  updateDeviceInfo();
  addLog("Slug detected: " + (slug || "MISSING"));

  // Anti-AdBlock Check
  const isAdBlocked = await detectAdBlock();
  if(isAdBlocked) {
    document.getElementById('adblockWarning').classList.remove('hidden');
    addLog("AdBlock detected! Please disable.", "error");
  } else {
    addLog("AdBlock check passed - Clean", "success");
  }

  if(!slug) {
    showError("No slug provided - URL ma ?c=SLUG missing che");
    return;
  }

  // Fetch DB and find URL
  const db = await fetchDatabase();
  destinationUrl = db[slug];

  if(!destinationUrl) {
    addLog("Slug '" + slug + "' not found in DB", "error");
    showError();
    return;
  }

  addLog("Destination found: " + destinationUrl.substring(0, 50) + "...", "success");
  document.getElementById('destUrl').textContent = destinationUrl;
  document.getElementById('destPreview').classList.remove('hidden');
  document.getElementById('statusText').textContent = "LINK VERIFIED • READY";
  document.getElementById('mainTitle').textContent = "Almost There! Bas 5 Second...";
  
  // Track click in localStorage
  try {
    const clicks = JSON.parse(localStorage.getItem(STORAGE_CLICKS) || "{}");
    clicks[slug] = (clicks[slug] || 0) + 1;
    localStorage.setItem(STORAGE_CLICKS, JSON.stringify(clicks));
    addLog("Click tracked - Total: " + clicks[slug], "success");
  } catch(e) {}

  // Start Countdown
  startCountdown();
}

function startCountdown() {
  const bigEl = document.getElementById('countdownBig');
  const smallEl = document.getElementById('countdownSmall');
  const skipBtn = document.getElementById('skipBtn');
  const skipCount = document.getElementById('skipCountdown');
  const countText = document.getElementById('countText');
  const progress = document.getElementById('countdownProgress');
  const progressBar = document.getElementById('progressBar');

  countdownInterval = setInterval(() => {
    countdown--;
    
    bigEl.textContent = countdown;
    smallEl.textContent = countdown;
    skipCount.textContent = countdown + 's';
    countText.textContent = countdown + ' SECONDS';
    
    const pct = (countdown / 5) * 100;
    progress.style.width = pct + '%';
    progressBar.style.width = ((5 - countdown) / 5 * 100) + '%';

    addLog("Redirect in " + countdown + "s...");

    if(countdown <= 0) {
      clearInterval(countdownInterval);
      enableSkip();
    }
  }, 1000);
}

function enableSkip() {
  const skipBtn = document.getElementById('skipBtn');
  skipBtn.disabled = false;
  skipBtn.classList.remove('bg-white/[0.06]', 'text-zinc-500', 'cursor-not-allowed');
  skipBtn.classList.add('bg-white', 'text-black', 'hover:bg-zinc-100', 'cursor-pointer', 'shadow-[0_0_20px_rgba(255,255,255,0.2)]');
  skipBtn.innerHTML = 'Skip Ad & Continue →';
  skipBtn.onclick = doRedirect;
  
  document.getElementById('statusText').textContent = "READY TO REDIRECT • CLICK SKIP";
  document.getElementById('mainTitle').textContent = "Taiyaar Che! Have Jai Sako Cho";
  addLog("Countdown complete - Ready to redirect!", "success");

  // Auto redirect after 1 sec if user doesn't click (optional - comment if not wanted)
  setTimeout(() => {
    if(document.getElementById('skipBtn').disabled === false) {
      addLog("Auto-redirecting now...");
      doRedirect();
    }
  }, 1200);
}

function doRedirect() {
  if(!destinationUrl) return;
  addLog("Redirecting to: " + destinationUrl, "success");
  document.getElementById('statusText').textContent = "REDIRECTING...";
  document.getElementById('mainTitle').textContent = "Redirecting...";
  document.getElementById('progressBar').style.width = '100%';
  // Small delay for UX
  setTimeout(() => {
    window.location.href = destinationUrl;
  }, 400);
}

function showError(customMsg) {
  document.getElementById('errorState').classList.remove('hidden');
  document.getElementById('destPreview').classList.add('hidden');
  document.getElementById('statusText').textContent = "ERROR • LINK NOT FOUND";
  document.getElementById('statusText').className = "inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-red-500/10 border border-red-500/20 text-[11px] font-mono text-red-300 mb-3";
  document.getElementById('mainTitle').textContent = customMsg || "Oops! Aa Link Malti Nathi";
  document.getElementById('subText').textContent = "Slug check karo ke admin panel ma link add che ke nahi. Database.html update karvu padshe.";
  clearInterval(countdownInterval);
  document.getElementById('countdownBig').textContent = "!";
  addLog(customMsg || "Error: slug not found", "error");
}

// Start
document.addEventListener('DOMContentLoaded', init);
<\/script>
